name: main
on: push
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            version: "24.x"

      - name: Install dependencies
        run: make setup

      - name: Run tests
        run: make test

      - name: Hello from Hexlet Action
        uses: hexlet-components/hello-from-hexlet-action@release

